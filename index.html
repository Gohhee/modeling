<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>3Rwave Product AR Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ef;
        --surface: #ffffff;
        --ink: #111216;
        --muted: #646874;
        --line: #d9d3c9;
        --accent: #0f766e;
        --accent-strong: #0a5c56;
        --warn: #9f4f12;
        --error: #a33434;
        --shadow: 0 18px 48px rgba(37, 34, 29, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      a {
        color: inherit;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px clamp(18px, 4vw, 48px);
        border-bottom: 1px solid rgba(17, 18, 22, 0.08);
      }

      .brand {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .brand strong {
        font-size: clamp(24px, 3vw, 34px);
        line-height: 1;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .status-pill {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 13px;
        font-size: 13px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.62);
      }

      .status-pill.ready {
        color: var(--accent-strong);
        border-color: rgba(15, 118, 110, 0.32);
        background: rgba(15, 118, 110, 0.08);
      }

      .status-pill.error {
        color: var(--error);
        border-color: rgba(163, 52, 52, 0.28);
        background: rgba(163, 52, 52, 0.08);
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(330px, 430px);
        gap: clamp(20px, 3vw, 36px);
        align-items: stretch;
        padding: clamp(18px, 4vw, 48px);
      }

      .viewer-shell {
        min-height: 520px;
        border: 1px solid var(--line);
        background: #ece8df;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        min-height: 520px;
        --poster-color: #ece8df;
        --progress-bar-color: var(--accent);
        --progress-bar-height: 3px;
      }

      .ar-button {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        min-width: 178px;
        height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 0;
        border-radius: 999px;
        padding: 0 20px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        box-shadow: 0 12px 28px rgba(15, 118, 110, 0.28);
        cursor: pointer;
      }

      .ar-button:hover {
        background: var(--accent-strong);
      }

      svg {
        flex: 0 0 auto;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
      }

      .intro {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(34px, 4vw, 52px);
        line-height: 1.04;
        letter-spacing: 0;
      }

      .intro p,
      .detail-copy {
        color: var(--muted);
        line-height: 1.68;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .button {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        text-decoration: none;
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }

      .button.primary {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
      }

      .button:hover {
        border-color: rgba(15, 118, 110, 0.45);
      }

      .button.primary:hover {
        background: var(--accent-strong);
      }

      .button svg {
        width: 18px;
        height: 18px;
      }

      .notice,
      .content-block {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: rgba(255, 255, 255, 0.64);
      }

      .notice {
        color: var(--warn);
        display: none;
        line-height: 1.55;
      }

      .notice.visible {
        display: block;
      }

      .content-block h2 {
        margin-bottom: 12px;
        font-size: 17px;
        line-height: 1.3;
      }

      .spec-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .spec-table th,
      .spec-table td {
        border-top: 1px solid rgba(17, 18, 22, 0.1);
        padding: 12px 0;
        text-align: left;
        vertical-align: top;
      }

      .spec-table tr:first-child th,
      .spec-table tr:first-child td {
        border-top: 0;
      }

      .spec-table th {
        width: 46%;
        color: var(--ink);
        font-weight: 700;
      }

      .spec-table td {
        color: var(--muted);
      }

      #errorBox {
        display: none;
        border-color: rgba(163, 52, 52, 0.28);
        color: var(--error);
        background: rgba(163, 52, 52, 0.08);
      }

      #errorBox.visible {
        display: block;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
          padding: 0;
          gap: 0;
        }

        .topbar {
          position: sticky;
          top: 0;
          z-index: 10;
          background: rgba(247, 244, 239, 0.92);
          backdrop-filter: blur(14px);
        }

        .viewer-shell {
          min-height: 58vh;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }

        model-viewer {
          min-height: 58vh;
        }

        .panel {
          padding: 24px 18px 34px;
        }
      }

      @media (max-width: 520px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }

        .brand {
          flex-direction: column;
          gap: 4px;
        }

        .actions {
          grid-template-columns: 1fr;
        }

        .ar-button {
          width: calc(100% - 36px);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <strong>3Rwave</strong>
          <span>Product AR Viewer</span>
        </div>
        <div id="loadStatus" class="status-pill">모델 확인 중</div>
      </header>

      <main>
        <section class="viewer-shell" aria-label="제품 3D 뷰어">
          <model-viewer
            id="viewer"
            src="./Divide_B_260513.glb"
            ios-src="./Divide_B_260513.usdz"
            alt="제품 3D 모델"
            camera-controls
            touch-action="pan-y"
            auto-rotate
            rotation-per-second="18deg"
            ar
            ar-modes="webxr scene-viewer quick-look"
            ar-scale="auto"
            ar-placement="floor"
            shadow-intensity="1"
            exposure="1"
            environment-image="neutral"
          >
            <button slot="ar-button" class="ar-button" type="button">
              <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
                <path
                  d="M12 2.6 4.2 6.9v10.2L12 21.4l7.8-4.3V6.9L12 2.6Zm0 2.3 5.1 2.8L12 10.5 6.9 7.7 12 4.9ZM6.2 9.5l4.8 2.7v6.2l-4.8-2.7V9.5Zm6.8 8.9v-6.2l4.8-2.7v6.2L13 18.4Z"
                  fill="currentColor"
                />
              </svg>
              AR로 보기
            </button>
          </model-viewer>
        </section>

        <aside class="panel">
          <section class="intro">
            <h1>제품 PN</h1>
            <p>제품의 간단한 설명</p>
          </section>

          <div id="browserNotice" class="notice">
            인앱 브라우저에서는 AR 실행이 제한될 수 있습니다. iPhone은 Safari, Android는 Chrome에서 열어 주세요.
          </div>

          <div id="errorBox" class="notice"></div>

          <nav class="actions" aria-label="제품 문의 및 이동">
            <button id="openArButton" class="button primary" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 2.3 4.9 2.7L12 10.7 7.1 8 12 5.3Zm-5.8 5 4.8 2.6v5.3l-4.8-2.7v-5.2Zm6.8 7.9v-5.3l4.8-2.6v5.2L13 18.2Z" fill="currentColor" />
              </svg>
              AR 실행
            </button>
            <a class="button" href="#" data-pending="홈페이지 URL을 추가해 주세요.">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm6.7 8h-3.1a14.7 14.7 0 0 0-1.1-5 7 7 0 0 1 4.2 5ZM12 5.1c.6.8 1.3 2.6 1.6 5.9h-3.2c.3-3.3 1-5.1 1.6-5.9ZM5.3 13h3.1c.1 1.8.5 3.5 1.1 5a7 7 0 0 1-4.2-5Zm3.1-2H5.3a7 7 0 0 1 4.2-5 14.7 14.7 0 0 0-1.1 5Zm3.6 7.9c-.6-.8-1.3-2.6-1.6-5.9h3.2c-.3 3.3-1 5.1-1.6 5.9Zm2.5-.9c.6-1.5 1-3.2 1.1-5h3.1a7 7 0 0 1-4.2 5Z" fill="currentColor" />
              </svg>
              홈페이지 연결
            </a>
            <a class="button" href="#" data-pending="이메일 주소를 추가해 주세요.">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v.4l8 5.1 8-5.1V7H4Zm0 2.8V17h16V9.8l-8 5.1-8-5.1Z" fill="currentColor" />
              </svg>
              이메일 문의
            </a>
            <a class="button" href="#" data-pending="제품 자료 파일을 추가해 주세요.">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 2h9l5 5v15H6V2Zm8 2H8v16h10V8h-4V4Zm-3 7h2v4.2l1.9-1.9 1.4 1.4L12 19l-4.3-4.3 1.4-1.4 1.9 1.9V11Z" fill="currentColor" />
              </svg>
              제품 자료
            </a>
          </nav>

          <section class="content-block">
            <h2>제품 Spec</h2>
            <table class="spec-table" aria-label="제품 Spec">
              <tr>
                <th>Freq</th>
                <td>추가 예정</td>
              </tr>
              <tr>
                <th>Return loss</th>
                <td>추가 예정</td>
              </tr>
              <tr>
                <th>Insertion loss</th>
                <td>추가 예정</td>
              </tr>
            </table>
          </section>

          <section class="content-block">
            <h2>제품의 상세 설명</h2>
            <p class="detail-copy">제품의 상세 설명</p>
          </section>
        </aside>
      </main>
    </div>

    <script>
      const viewer = document.querySelector("#viewer");
      const loadStatus = document.querySelector("#loadStatus");
      const errorBox = document.querySelector("#errorBox");
      const browserNotice = document.querySelector("#browserNotice");
      const openArButton = document.querySelector("#openArButton");

      const userAgent = navigator.userAgent || "";
      const isInAppBrowser = /Instagram|FBAN|FBAV|KAKAOTALK|Line\/|NAVER|DaumApps/i.test(userAgent);
      const isIOS =
        /iPad|iPhone|iPod/.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isInAppBrowser) {
        browserNotice.classList.add("visible");
      }

      function setStatus(text, type) {
        loadStatus.textContent = text;
        loadStatus.className = `status-pill${type ? ` ${type}` : ""}`;
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add("visible");
        setStatus("확인 필요", "error");
      }

      viewer.addEventListener("load", () => {
        setStatus("3D 모델 준비 완료", "ready");
      });

      viewer.addEventListener("error", (event) => {
        const detail = event.detail && event.detail.sourceError ? ` (${event.detail.sourceError.message})` : "";
        showError(`모델을 불러오지 못했습니다. GLB 경로, MIME, HTTPS, CORS 설정을 확인하세요.${detail}`);
      });

      viewer.addEventListener("ar-status", (event) => {
        if (event.detail.status === "failed") {
          showError("AR 실행에 실패했습니다. 기본 브라우저에서 다시 열고 GLB/USDZ 파일 접근 여부를 확인하세요.");
        }
      });

      openArButton.addEventListener("click", async () => {
        try {
          await viewer.activateAR();
        } catch (error) {
          if (isIOS) {
            location.href = viewer.getAttribute("ios-src");
            return;
          }
          showError("AR을 바로 실행할 수 없습니다. Chrome 또는 Safari에서 페이지를 다시 열어 주세요.");
        }
      });

      document.querySelectorAll("[data-pending]").forEach((link) => {
        link.addEventListener("click", (event) => {
          if (link.getAttribute("href") === "#") {
            event.preventDefault();
            showError(link.dataset.pending);
          }
        });
      });

      if (!window.isSecureContext && location.protocol !== "file:") {
        showError("현재 페이지가 HTTPS가 아닙니다. 실제 QR 배포 전 HTTPS 주소로 올려 주세요.");
      }
    </script>
  </body>
</html>
